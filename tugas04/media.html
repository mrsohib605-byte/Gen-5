<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampilan Media & Form Profesional</title>
    <link rel="icon" type="image/x-icon" href="assets/foto petik jombang.jpeg">
    <!-- Font Poppins untuk kesan Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        /* 1. ANIMASI GRADASI BERGERAK (VIBRANT & MODERN) */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
            
            /* Palet warna gradasi yang lebih berani dan elegan */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        /* Keyframes untuk pergerakan background yang super halus */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. KOTAK KACA (PREMIUM GLASSMORPHISM) */
        .media-tengah {
            background: rgba(255, 255, 255, 0.4); /* Lebih transparan agar gradasi tembus */
            backdrop-filter: blur(20px); /* Efek blur kaca diperkuat */
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2); /* Bayangan lebih dalam */
            text-align: center;
            max-width: 850px;
            width: 100%;
        }

        /* 3. PENATAAN MEDIA */
        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .image-grid img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .image-grid img:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
        }

        .media-tengah video, 
        .media-tengah iframe {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: none;
            background: #000;
        }

        .media-tengah audio {
            width: 100%;
            margin-bottom: 30px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* 4. FORMULIR MODERN & INTERAKTIF */
        .form-container {
            margin-top: 20px;
            padding-top: 30px;
            border-top: 2px dashed rgba(255, 255, 255, 0.5);
            text-align: left;
        }

        .form-container h2 {
            margin-top: 0;
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.7);
            color: #333;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Efek saat form di-klik (Focus) */
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #ff416c;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 65, 108, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Tombol Submit Keren */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 65, 108, 0.6);
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        .btn-submit:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(255, 65, 108, 0.4);
        }
    </style>
</head>

<body>
    <div class="media-tengah">
        
        <!-- Grid Gambar dengan Efek Hover -->
        <div class="image-grid">
            <img src="assets/Screenshot 2026-10-01 073325.png" alt="Gambar 1">
            <img src="assets/Screenshot 2026-10-01 073325.png" alt="Gambar 2">
        </div>
        
        <!-- Audio -->
        <audio controls>
            <source src="assets/Ibadow & Ibadowa - For the rest of my life (Cover Maher Zain) - Ibadow.mp3" type="audio/mpeg">
        </audio>

        <!-- Video -->
        <video controls>
            <source src="assets/Oranye dan Hijau Modern Jadwal Imam Shalat Ramadan 2025 Animasi Social Media.mp4" type="video/mp4">
        </video>

        <!-- YouTube iFrame -->
        <iframe height="400" src="https://www.youtube.com/embed/cQHyqOy1Uqo?si=qt2Y0f-wSM09v3_s"
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
        </iframe>

        <!-- Form Modern dengan Efek Fokus -->
        <div class="form-container">
            <h2>Hubungi Kami</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <input type="text" name="nama" placeholder="Nama Lengkap Anda" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Alamat Email Anda" required>
                </div>
                <div class="form-group">
                    <textarea name="pesan" placeholder="Ketik pesan atau pertanyaan di sini..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Kirim Pesan Sekarang</button>
            </form>
        </div>

    </div>
</body>

</html>
